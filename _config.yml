# ---------------------------------------------------------------
# Site settings — edit these
# ---------------------------------------------------------------
title: "Department Retreat 2026"
tagline: "Talks, posters, and abstracts"
dates: "November 11, 2026"
location: "Los Angeles, CA"

# If your site lives at https://USERNAME.github.io/REPO-NAME/,
# set baseurl to "/REPO-NAME". If it's a user site
# (https://USERNAME.github.io/), leave it as "".
baseurl: "/QCB-retreat-2026"
url: "https://lexishew.github.io"

# ---------------------------------------------------------------
# CSV column names — change these if your spreadsheet headers differ
# (the CSV lives at _data/abstracts.csv)
# ---------------------------------------------------------------
columns:
  id: "id"            # optional; used for links. Blank = generated from title
  type: "type"        # e.g. Talk / Poster
  title: "title"
  authors: "authors"
  affiliation: "affiliation"   # optional
  abstract: "abstract"

# ---------------------------------------------------------------
# Column names for the abstracts page. Each must match its CSV's header row exactly.
# Talks: _data/talk_abstracts.csv. Posters: _data/poster_abstracts.csv.
#
# sort_name is the column the lists are alphabetised by. The form collects it
# as the submitter's surname, which is the first author in all but a couple of
# rows; blank it out to keep the CSV's own row order instead.
#
# section (posters only) groups the posters into their own contents sections.
# If the column is missing or empty, posters render as a single list. Column
# names are matched case-sensitively, so this must be the CSV header verbatim.
#
# section_label is prepended when a section value is a plain number, so a CSV
# holding 1/2/3 reads as "Theme 1". Blank it if the CSV holds full section
# names instead. A value of 0 or an empty cell means "not assigned yet".
#
# section_names gives each numbered section a name, shown after the label as
# "Theme 1: <name>". Numbers missing from it show the label alone.
# ---------------------------------------------------------------
talk_columns:
  title: "Talk/Poster Title"
  authors: "Author(s)"
  affiliation: "Please indicate your lab affiliation."
  abstract: "Abstract"
  sort_name: "Last Name"

poster_columns:
  title: "Talk/Poster Title"
  authors: "Author(s)"
  affiliation: "Please indicate your lab affiliation."
  abstract: "Abstract"
  sort_name: "Last Name"
  section: "Section"
  section_label: "Theme "
  section_names:
    "1": "Population Genomics and Systems Biology"
    "2": "Structural Bioinformatics and Genome Organization"
    "3": "Genomic Algorithms and Computational Methods"

# Order that presentation types appear on the abstracts page.
# Any type in the CSV that isn't listed here is shown afterward.
type_order:
  - Talk
  - Poster

markdown: kramdown
exclude:
  - README.md
