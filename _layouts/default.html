<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main">
        {% assign here = page.url %}
        <a href="{{ '/' | relative_url }}" {% if here == '/' or here == '/index.html' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/schedule/' | relative_url }}" {% if here contains '/schedule' %}aria-current="page"{% endif %}>Schedule</a>
        <a href="{{ '/abstracts/' | relative_url }}" {% if here contains '/abstracts' %}aria-current="page"{% endif %}>Talks &amp; Abstracts</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      {{ site.title }} · {{ site.dates }} · {{ site.location }}
      {% if site.contact_email %} · <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>{% endif %}
    </div>
  </footer>
</body>
</html>
